# ubimi configuration.
#
# ubimi keeps an in-memory index of a Swift-compatible object store
# (RadosGW) and serves autoindex-style listings. Links point directly at the
# object store; ubimi never proxies object bytes.

listen = ":8080"

[storage]
# Identity (Keystone) API version: 1, 2 or 3. Leave unset to infer it from
# auth_url. Versions 2 and 3 authenticate against a project and require
# `project`; version 1 authenticates with just user/password.
# auth_version = 3

# Identity endpoint; the version is usually part of the path, e.g. .../v3,
# .../v2.0 or .../v1.0.
auth_url       = "https://keystone.example.com/v3"
user           = "ubimi"
password       = "secret"
user_domain    = "Default"
project        = "images"
project_domain = "Default"
region         = "RegionOne"

# Externally reachable base used to build listing links and redirects.
# This is never taken from the Keystone catalog.
public_url = "https://images.example.com"

[index]
refresh_interval = "5m"

# Optional rsync daemon listener. It exposes the whole index as a single
# read-only module whose top-level directories are the containers. Unlike the
# HTTP listener, it streams object bytes from the object store.
[rsync]
# listen = ":873"   # uncomment to enable
module = "ubimi"

# Optional redirect farm for legacy URLs. Rules are evaluated in order and
# matched on host (exact, *.suffix, or any when empty). Each rule uses either a
# path prefix (path) with {path}/{container} in the target, or a regular
# expression (match) with named capture groups referenced as {name}.

[[route]]
host   = "old-images.example.com"
path   = "/"
target = "https://images.example.com/{path}"
status = 302

[[route]]
path   = "/legacy/"
target = "https://images.example.com/{path}"

# Reorder path segments, e.g. cdimage.ubuntu.com/ubuntu/releases/24.04 ->
# images.ubuntu.com/images/24.04/ubuntu.
[[route]]
host   = "cdimage.ubuntu.com"
match  = "^/(?P<product>[^/]+)/releases/(?P<series>[^/]+)/?$"
target = "https://images.ubuntu.com/images/{series}/{product}"
status = 302
