# ubimi configuration.
#
# ubimi keeps an in-memory index of a Swift-compatible object store
# (RadosGW) and serves autoindex-style listings. Links point directly at the
# object store; ubimi never proxies object bytes.

listen = ":8080"

[storage]
# Identity (Keystone) API version: 1, 2 or 3. Leave unset to infer it from
# auth_url. Versions 2 and 3 authenticate against a project and require
# `project`; version 1 authenticates with just user/password.
# auth_version = 3

# Identity endpoint; the version is usually part of the path, e.g. .../v3,
# .../v2.0 or .../v1.0.
auth_url       = "https://keystone.example.com/v3"
user           = "ubimi"
password       = "secret"
user_domain    = "Default"
project        = "images"
project_domain = "Default"
region         = "RegionOne"

# Externally reachable base used to build listing links and redirects.
# This is never taken from the Keystone catalog.
public_url = "https://images.example.com"

[index]
refresh_interval = "5m"

# Optional rsync daemon listener. Modules named after a known layout expose the
# canonical images tree through that legacy layout:
#   cdimage  -> cdimage.ubuntu.com tree
#   releases -> releases.ubuntu.com tree
#   images   -> canonical images tree
# Other module names expose all containers directly. Unlike the HTTP listener,
# rsync streams object bytes from the object store on demand.
[rsync]
# listen = ":873"   # uncomment to enable
modules = ["cdimage", "releases", "images"]

# Optional per-host tree layouts for the HTTP listener. Each host is served the
# named layout (cdimage, releases or images), which translates the legacy tree
# onto the canonical images tree and redirects object requests to the object
# store. Hosts not listed fall back to the images layout, whose first path
# segment selects the container (mirroring the Swift URL layout).
[layouts]
"cdimage.ubuntu.com"  = "cdimage"
"releases.ubuntu.com" = "releases"
