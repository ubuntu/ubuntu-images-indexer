name: ubuntu-images-indexer
version: 0.1.0
base: ubuntu@24.04
build-base: ubuntu@24.04
run-user: _daemon_

platforms:
  amd64:

summary: An image for indexing and serving a Swift-compatible object store.
description: |
  ubimi keeps an in-memory index of a Swift-compatible object store (RadosGW)
  and serves autoindex-style HTML listings whose links point directly at the
  object store. An optional rsync daemon listener streams object bytes for
  mirroring.

  This image ships ubimi so that it can be deployed and managed by Juju.

services:
  ubimi:
    override: replace
    startup: enabled
    command: /usr/bin/ubimi -config /etc/ubimi/config.toml

parts:
  ubimi-app:
    plugin: go
    source: .
    build-snaps:
      - go/1.26/stable
    # ubimi requires cgo: the rsync daemon pulls in a dependency chain that
    # needs a C toolchain, so CGO_ENABLED cannot be disabled here.
    build-packages:
      - gcc
      - libc6-dev
    build-environment:
      - CGO_ENABLED: "1"
    override-build: |
      go build -trimpath -ldflags="-s -w" -o "${CRAFT_PART_INSTALL}/bin/ubimi" ./cmd/ubimi
    organize:
      bin/ubimi: usr/bin/ubimi
    stage:
      - usr/bin/ubimi

  runtime:
    plugin: nil
    # ubimi talks to Keystone and Swift over HTTPS.
    stage-packages:
      - ca-certificates

  user-setup:
    plugin: nil
    override-prime: |
      craftctl default
      # Shared identity used by Rockcraft and Juju workload containers.
      UBIMI_UID=584792
      UBIMI_GID=584792
      # The charm writes the workload configuration here.
      mkdir -p etc/ubimi
      chown -R ${UBIMI_UID}:${UBIMI_GID} etc/ubimi
      chmod -R 750 etc/ubimi
